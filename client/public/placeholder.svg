<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <circle cx="400" cy="400" r="300" fill="url(#glow)" />

  <g transform="translate(400, 420)">
    <!-- Central decorative AI node / Matrix ring -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#accent-grad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
    <circle cx="0" cy="0" r="80" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" opacity="0.8" />
    <circle cx="0" cy="0" r="50" fill="url(#accent-grad)" opacity="0.9" />

    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">M</text>
  </g>

  <!-- Title / Tagline -->
  <text x="400" y="620" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">Matrix AI Platform</text>
  <text x="400" y="660" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Enterprise AI Agents, Search &amp; Knowledge Base</text>
</svg>
